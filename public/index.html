<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>果果五子棋</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <h1>果果五子棋 🍈</h1>
        <div class="topbar-btns">
          <button id="fsBtn" type="button" title="全屏">⛶</button>
          <button id="showLoginBtn" type="button" class="link hidden">登录</button>
          <span id="userChip" class="user-chip hidden"></span>
          <button id="logoutBtn" type="button" class="link hidden">退出</button>
        </div>
      </header>

      <!-- 大厅 -->
      <section id="lobby" class="panel">
        <div id="loginBox" class="card">
          <p class="card-title">登录果果账号 <small>(与果果麻将通用)</small></p>
          <div class="form-row">
            <input id="loginUser" placeholder="账号" maxlength="16" autocomplete="username" />
            <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password" />
          </div>
          <div class="form-row">
            <input id="regName" class="hidden" placeholder="昵称(注册时填)" maxlength="8" />
          </div>
          <div class="form-row btns">
            <button id="loginBtn" type="button" class="primary">登录</button>
            <button id="regBtn" type="button">注册</button>
            <button id="skipBtn" type="button" class="link">先不登录, 直接玩</button>
          </div>
          <p id="notifyRow" class="notify-row hidden">
            <label><input id="notifyChk" type="checkbox" /> 开启对局邀请通知</label>
          </p>
        </div>

        <div class="card">
          <p class="card-title">选择玩法</p>
          <div class="lobby-btns">
            <button id="localBtn" type="button" class="big">👫 本地对战</button>
            <button id="onlineBtn" type="button" class="big">🌐 在线对战</button>
          </div>
        </div>

        <!-- 好友 (登录后显示) -->
        <div id="friendsCard" class="card hidden">
          <p class="card-title">好友</p>
          <div class="form-row">
            <input id="addFriendInput" placeholder="输入对方账号加好友" maxlength="16" />
            <button id="addFriendBtn" type="button">加好友</button>
          </div>
          <div id="friendReq" class="friend-list"></div>
          <div id="friendList" class="friend-list"></div>
        </div>
      </section>

      <!-- 在线: 建房/加入 -->
      <section id="onlinePanel" class="panel hidden">
        <div class="card">
          <p class="card-title">创建房间</p>
          <p class="opt-row">
            棋盘
            <select id="sizeSel">
              <option value="15">15 路 (经典)</option>
              <option value="19">19 路 (大盘)</option>
            </select>
          </p>
          <p class="card-sub">对手</p>
          <div class="lobby-btns">
            <button id="createRoomBtn" type="button" class="big">👫 等好友加入</button>
          </div>
          <div class="lobby-btns">
            <button id="botEasy" type="button" class="bot-btn">🐟 蓝色大肥鱼</button>
            <button id="botMed" type="button" class="bot-btn">🫘 豆包</button>
            <button id="botHard" type="button" class="bot-btn">⚡ Z</button>
          </div>
          <p class="card-sub">或加入好友房间</p>
          <div class="form-row">
            <input id="codeInput" class="code-input" inputmode="numeric" maxlength="4" placeholder="0000" />
            <button id="joinRoomBtn" type="button" class="primary">加入</button>
          </div>
          <button id="backBtn" type="button" class="link">← 返回</button>
        </div>
      </section>

      <!-- 棋局 -->
      <section id="gameArea" class="panel hidden">
        <div id="roomTabs" class="room-tabs"></div>
        <p id="status">当前回合：黑棋 ●</p>
        <div id="board" class="board" aria-label="果果五子棋棋盘"></div>
        <div class="toolbar">
          <button id="resetBtn" type="button">重新开始</button>
          <button id="inviteBtn" type="button" class="hidden">邀请好友</button>
          <button id="exitBtn" type="button" class="hidden">离开房间</button>
          <button id="homeBtn" type="button" class="hidden">返回大厅</button>
        </div>
        <div id="chatLog" class="chat-log hidden"></div>
        <form id="chatForm" class="chat-form hidden">
          <input id="chatInput" maxlength="100" placeholder="说点什么…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
        <p id="msgErr"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>

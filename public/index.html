<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>果果五子棋</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>果果五子棋 🍈</h1>

      <!-- 大厅: 选模式 -->
      <section id="lobby" class="lobby">
        <p class="lobby-title">选择玩法</p>
        <div class="lobby-btns">
          <button id="localBtn" type="button" class="big">👫 本地对战</button>
          <button id="onlineBtn" type="button" class="big">🌐 在线对战</button>
        </div>
      </section>

      <!-- 在线: 创建/加入房间 -->
      <section id="onlinePanel" class="lobby hidden">
        <p class="lobby-title">
          昵称 <input id="nameInput" class="name-input" maxlength="12" placeholder="你的昵称" />
        </p>
        <div class="lobby-btns">
          <button id="createRoomBtn" type="button" class="big">创建房间</button>
        </div>
        <p class="lobby-title join-title">
          <input id="codeInput" class="code-input" inputmode="numeric" maxlength="4" placeholder="0000" />
          <button id="joinRoomBtn" type="button">加入</button>
        </p>
        <button id="backBtn" type="button" class="link">← 返回</button>
      </section>

      <!-- 棋局 -->
      <section id="gameArea" class="hidden">
        <p id="status">当前回合：黑棋 ●</p>
        <div id="board" class="board" aria-label="果果五子棋棋盘"></div>
        <div class="toolbar">
          <button id="resetBtn" type="button">重新开始</button>
          <button id="exitBtn" type="button" class="hidden">离开房间</button>
        </div>
        <div id="chatLog" class="chat-log hidden"></div>
        <form id="chatForm" class="chat-form hidden">
          <input id="chatInput" maxlength="100" placeholder="说点什么…" autocomplete="off" />
          <button type="submit">发送</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
